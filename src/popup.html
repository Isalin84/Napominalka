<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Напоминалка</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body class="popup-body">
    <main class="popup-shell" id="popup-shell">
      <div class="popup-pet" id="popup-pet"></div>
      <div class="popup-card">
        <div class="popup-topline"><span class="popup-eyebrow" id="popup-eyebrow">Пауза</span><span class="popup-time" id="popup-time"></span></div>
        <h1 id="popup-title">Пора выпить воды</h1>
        <p id="popup-message">Пара глотков, и голова снова работает.</p>
        <div class="popup-actions"><button class="popup-settings" id="popup-settings" aria-label="Настройки" title="Настройки"></button><button class="popup-snooze" id="popup-snooze">Отложить</button><button class="popup-complete" id="popup-complete"><span id="popup-action">Готово</span><span>✓</span></button></div>
      </div>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
